name: Deploy portfolio

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Update projects at 00:00 on every 15th day-of-month
    - cron: "0 0 */15 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate repos JSON from GitHub GraphQL
        env:
          GH_GRAPHQL_API_URL: ${{secrets.GH_GRAPHQL_API_URL}}
          GH_AUTHORIZATION_TOKEN: ${{ secrets.GH_AUTHORIZATION_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOPIC: ${{ secrets.GH_TOPIC }}
          GH_REPOS_OUTPUT_FILE: "repos.json"
        run: node resources/index.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
