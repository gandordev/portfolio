query {
  search(
    query: "user:<GH_USERNAME> topic:<GH_TOPIC> sort:updated-desc"
    type: REPOSITORY
    first: 20
  ) {
    nodes {
      ... on Repository {
        name
        description
        url
        isArchived
        homepageUrl # deployed url
        # Projects langs
        languages(first: 10, orderBy: { field: SIZE, direction: DESC }) {
          nodes {
            name
          }
        }
        # Latest release if avaiable
        latestRelease {
          tagName
          name
          publishedAt
          url
        }
      }
    }
  }
}
